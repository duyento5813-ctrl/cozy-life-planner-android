
name: Build Cozy Life Planner APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html app.js cloud.js style.css supabase-config.js www/
          if [ -f manifest.webmanifest ]; then
            cp manifest.webmanifest www/
          fi
          if [ -f icon-192.png ]; then
            cp icon-192.png www/
          fi
          if [ -f icon-512.png ]; then
            cp icon-512.png www/
          fi
          if [ -f sw.js ]; then
            cp sw.js www/
          fi
          test -f www/index.html

      - name: Create Android project
        run: npx cap add android

      - name: Sync web files
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: bash ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cozy-Life-Planner-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
